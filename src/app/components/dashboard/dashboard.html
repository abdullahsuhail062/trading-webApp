<div class="news-container">
  <h2>Forex Market News</h2>
  
  <div *ngFor="let news of newsList" class="news-card">
    <img [src]="news.image" alt="News Image" width="100">
    <div class="content">
      <h3>{{ news.headline }}</h3>
      <p>{{ news.summary }}</p>
      <small>Source: {{ news.source }} | {{ news.datetime * 1000 | date:'medium' }}</small>
      <br>
      <a [href]="news.url" target="_blank">Read Full Article</a>
    </div>
  </div>
</div>
